name: CI

on:
  push:
    branches: [ develop, master ]

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ asia,hetzner ]

    runs-on: [ self-hosted, "${{ matrix.runner }}" ]

    environment: ${{ matrix.runner }}-${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > ./.env <<EOF
          NODE_ENV=${{ vars.NODE_ENV }}
          PARSE_SERVER=${{ vars.PARSE_SERVER }}
          REST_API_KEY=${{ vars.REST_API_KEY }}
          MASTER_KEY=${{ secrets.MASTER_KEY }}
          APP_ID=${{ vars.APP_ID }}
          JAVASCRIPT_KEY=${{ vars.JAVASCRIPT_KEY }}
          PORT=${{ vars.PORT }}
          
          REDIS_PORT=${{ vars.REDIS_PORT }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          REDIS_DB=${{ vars.REDIS_DB }}
          
          QUEUE_REDIS_PORT=${{ vars.QUEUE_REDIS_PORT }}
          QUEUE_REDIS_HOST=${{ vars.QUEUE_REDIS_HOST }}
          QUEUE_REDIS_DB=${{ vars.QUEUE_REDIS_DB }}
          
          BULL_REDIS_CLUSTER_NODES=${{ vars.BULL_REDIS_CLUSTER_NODES }}
          EOF

      - name: chmod ci file
        run: chmod +x ./ci.sh

      - name: Run CI/CD file
        run: bash ./ci.sh